experiment:
  name: baseline
  seed: 42

data:
  n_empresas: 1000
  n_periodos: 12
  n_cohortes: 4
  cupo_por_cohorte: [80, 100, 120, 150]
  random_seed: 2024

features:
  - antiguedad
  - ratio_formalidad
  - empleados
  - salario_promedio
  - exportadora
  - sector
  - region

split:
  train_nini_ratio: 0.5
  seed: 13

model:
  lstm_hidden_size: 64
  lstm_num_layers: 2
  dropout: 0.3

training:
  optimizer: Adam
  learning_rate: 1.0e-3
  n_epochs: 10
  batch_size: 32

optuna:
  n_trials: 50
  search_space:
    learning_rate: [1.0e-4, 1.0e-3, 1.0e-2]
    dropout: [0.3, 0.5, 0.7]
    lstm_hidden_size: [32, 64, 128, 256]
    lstm_num_layers: [2, 3, 4]

output:
  dir: runs/
  save_model: true
